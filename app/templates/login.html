<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Alta</title>
  <!-- Aplicar tema guardado antes de renderizar para evitar flash -->
  <script>
    (function() {
      const tema = localStorage.getItem('alta-tema') || 'light';
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/pico.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      text-align: center;
      margin-bottom: 0.25rem;
      color: var(--pico-primary);
    }
    .login-card .subtitle {
      text-align: center;
      color: var(--pico-muted-color);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

<div class="login-card">
  <article>
    <h1>Alta</h1>
    <p class="subtitle">Software administrativo para consultorios</p>

    {% if error %}
    <p style="color: var(--pico-del-color); font-size: 0.9rem;">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">
      <label for="email">
        Email
        <input type="email" id="email" name="email" placeholder="doctor@consultorio.com" required autocomplete="email" />
      </label>

      <label for="password">
        Contraseña
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </label>

      <button type="submit" style="width: 100%;">Entrar</button>
    </form>

    <p style="text-align: center; font-size: 0.85rem; margin-top: 1rem;">
      ¿No tienes cuenta? <a href="/registro">Crear cuenta</a>
    </p>
  </article>
</div>

</body>
</html>
